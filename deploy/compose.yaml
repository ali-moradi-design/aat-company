# /srv/apps/aat-company/compose.yaml: the site (Next.js standalone server).
# No database. The image is built in CI and only pulled here. .env next to this
# file holds IMAGE_TAG (the commit SHA to run).
name: aat-company

services:
  web:
    image: ghcr.io/ali-moradi-design/aat-company-web:${IMAGE_TAG:?IMAGE_TAG is not set}
    # Nginx on the host proxies to this; Docker bypasses ufw, so loopback only
    ports:
      - "127.0.0.1:3114:3000"
    read_only: true
    tmpfs:
      - /tmp
      # next/image writes resized photos here (sharp); uid/gid of the image's node user
      - "/app/.next/cache:uid=1000,gid=1000"
    security_opt: [no-new-privileges:true]
    # resizing the large photos with sharp needs more than a plain page server
    mem_limit: 384m
    restart: unless-stopped
